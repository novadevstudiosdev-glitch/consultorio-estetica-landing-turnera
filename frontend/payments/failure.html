<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❌ Pago Rechazado</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      color: #eb3349;
      margin-bottom: 15px;
      font-size: 32px;
    }

    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .info-box {
      background: #fff5f5;
      border-left: 4px solid #f45c43;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      text-align: left;
    }

    .info-box p {
      margin: 10px 0;
      font-size: 14px;
    }

    .info-box strong {
      color: #eb3349;
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.2s;
      margin: 5px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">❌</div>
    <h1>Pago Rechazado</h1>
    <p>Hubo un problema al procesar tu pago. No te preocupes, no se realizó ningún cargo.</p>

    <div class="info-box">
      <p><strong>Posibles razones:</strong></p>
      <p>💳 Fondos insuficientes</p>
      <p>🔒 Problemas con tu tarjeta</p>
      <p>⏰ Tiempo de pago expirado</p>
      <p>❌ Pago cancelado por el usuario</p>
    </div>

    <a href="test-mercadopago.html" class="btn">Intentar nuevamente</a>
    <a href="#" class="btn btn-secondary">Contactar soporte</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get('status');
    const externalReference = urlParams.get('external_reference');

    console.log('❌ Pago rechazado:', { status, externalReference });
  </script>
</body>
</html>
