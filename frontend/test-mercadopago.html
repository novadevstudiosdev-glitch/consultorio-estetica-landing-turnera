<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Mercado Pago - Turnera</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
        padding: 40px;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
        font-size: 14px;
      }

      input,
      select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin-top: 10px;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .info-box {
        background: #f0f4ff;
        border-left: 4px solid #667eea;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .info-box p {
        color: #555;
        font-size: 14px;
        line-height: 1.6;
      }

      .error {
        background: #ffe0e0;
        border-left: 4px solid #f44336;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        display: none;
      }

      .error p {
        color: #c62828;
        font-size: 14px;
      }

      .loading {
        display: none;
        text-align: center;
        margin-top: 20px;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .amount-preview {
        background: #f9fafb;
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
        text-align: center;
      }

      .amount-preview .label {
        color: #666;
        font-size: 12px;
        margin-bottom: 5px;
      }

      .amount-preview .value {
        color: #333;
        font-size: 32px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>💰 Test Mercado Pago</h1>
      <p class="subtitle">Prueba el flujo de pagos de la turnera</p>

      <div class="info-box">
        <p><strong>📍 Configuración:</strong></p>
        <p>Backend: <code id="backend-url">http://localhost:3000</code></p>
        <p>Token: Inicia sesión primero 👇</p>
      </div>

      <!-- Login Form -->
      <div id="login-section">
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="email"
            value="admin@test.com"
            placeholder="admin@test.com"
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            value="Admin123!"
            placeholder="Tu contraseña"
          />
        </div>

        <button class="btn" onclick="login()">🔐 Iniciar Sesión</button>
      </div>

      <!-- Payment Form (hidden initially) -->
      <div id="payment-section" style="display: none">
        <div class="form-group">
          <label>Appointment ID</label>
          <input type="text" id="appointmentId" placeholder="uuid-del-turno" />
        </div>

        <div class="form-group">
          <label>Monto (ARS)</label>
          <input type="number" id="amount" value="5000" placeholder="5000" />
        </div>

        <div class="amount-preview">
          <div class="label">Total a pagar</div>
          <div class="value">$<span id="amount-display">5000</span></div>
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <input
            type="text"
            id="description"
            value="Seña - Tratamiento Facial"
            placeholder="Descripción del pago"
          />
        </div>

        <div class="form-group">
          <label>Nombre del Cliente</label>
          <input
            type="text"
            id="payerName"
            value="Test User"
            placeholder="Juan Pérez"
          />
        </div>

        <div class="form-group">
          <label>Email del Cliente</label>
          <input
            type="email"
            id="payerEmail"
            value="test@test.com"
            placeholder="test@test.com"
          />
        </div>

        <button class="btn" onclick="createPayment()">
          💳 Crear Pago en Mercado Pago
        </button>
        <button
          class="btn"
          onclick="logout()"
          style="background: #e0e0e0; color: #333; margin-top: 10px"
        >
          Cerrar Sesión
        </button>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px; color: #666">Procesando...</p>
      </div>

      <div class="error" id="error">
        <p id="error-message"></p>
      </div>
    </div>

    <script>
      const BACKEND_URL = 'http://localhost:3000/api';
      let authToken = localStorage.getItem('auth_token');

      // Update amount display
      document.getElementById('amount').addEventListener('input', (e) => {
        document.getElementById('amount-display').textContent = e.target.value;
      });

      // Check if already logged in
      if (authToken) {
        showPaymentSection();
      }

      async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showError('Por favor completa todos los campos');
          return;
        }

        showLoading(true);
        hideError();

        try {
          const response = await fetch(`${BACKEND_URL}/auth/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              email,
              password,
              recaptchaToken: 'fake-token-for-testing',
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || 'Error al iniciar sesión');
          }

          authToken = data.accessToken;
          localStorage.setItem('auth_token', authToken);

          showPaymentSection();
        } catch (error) {
          showError(error.message);
        } finally {
          showLoading(false);
        }
      }

      function logout() {
        authToken = null;
        localStorage.removeItem('auth_token');
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('payment-section').style.display = 'none';
      }

      function showPaymentSection() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('payment-section').style.display = 'block';
      }

      async function createPayment() {
        const appointmentId = document.getElementById('appointmentId').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const description = document.getElementById('description').value;
        const payerName = document.getElementById('payerName').value;
        const payerEmail = document.getElementById('payerEmail').value;

        if (
          !appointmentId ||
          !amount ||
          !description ||
          !payerName ||
          !payerEmail
        ) {
          showError('Por favor completa todos los campos');
          return;
        }

        showLoading(true);
        hideError();

        try {
          const response = await fetch(
            `${BACKEND_URL}/payments/create-preference`,
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${authToken}`,
              },
              body: JSON.stringify({
                appointmentId,
                amount,
                description,
                payer: {
                  name: payerName,
                  email: payerEmail,
                },
              }),
            },
          );

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.message || 'Error al crear preferencia de pago',
            );
          }

          console.log('✅ Preferencia creada:', data);

          // Redirigir a Mercado Pago
          // En producción usa: data.initPoint
          // En testing usa: data.sandboxInitPoint
          window.location.href = data.sandboxInitPoint || data.initPoint;
        } catch (error) {
          showError(error.message);
        } finally {
          showLoading(false);
        }
      }

      function showLoading(show) {
        document.getElementById('loading').style.display = show
          ? 'block'
          : 'none';
        document.querySelectorAll('.btn').forEach((btn) => {
          btn.disabled = show;
        });
      }

      function showError(message) {
        const errorDiv = document.getElementById('error');
        const errorMessage = document.getElementById('error-message');
        errorMessage.textContent = message;
        errorDiv.style.display = 'block';
      }

      function hideError() {
        document.getElementById('error').style.display = 'none';
      }
    </script>
  </body>
</html>
